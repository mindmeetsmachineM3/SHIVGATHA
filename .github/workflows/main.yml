name: Shivgatha story Reel

# Posts one animated explainer Reel per run, 3 runs a day (IST):
#   morning 07:37, afternoon 12:37, evening 19:37
on:
  schedule:
    - cron: "7 2 * * *"
    - cron: "7 7 * * *"
    - cron: "7 14 * * *"
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional topic (empty = the AI picks a new story)"
        required: false
        default: ""
      dry_run:
        description: "Make the video but do NOT post it (use this for the first test)"
        type: boolean
        default: true
      diagnose:
        description: "Only check the Instagram token and publish quota"
        type: boolean
        default: false

concurrency:
  group: shivgatha-post
  cancel-in-progress: false

permissions:
  contents: write          # the bot saves state.json (which topics are done) back to the repo

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
      IG_HANDLE: ${{ vars.IG_HANDLE }}
      BRAND_NAME: ${{ vars.BRAND_NAME }}
      EXPLAIN_VOICE: ${{ vars.EXPLAIN_VOICE }}
      EXPLAIN_RATE: ${{ vars.EXPLAIN_RATE }}
      EXPLAIN_PITCH: ${{ vars.EXPLAIN_PITCH }}
      EXPLAIN_DEEP: ${{ vars.EXPLAIN_DEEP }}
      EXPLAIN_SFX: ${{ vars.EXPLAIN_SFX }}
      BGM_LEVEL: ${{ vars.BGM_LEVEL }}
      SFX_LEVEL: ${{ vars.SFX_LEVEL }}
      EXPLAIN_TTS: ${{ vars.EXPLAIN_TTS }}
      GEMINI_TTS_VOICE: ${{ vars.GEMINI_TTS_VOICE }}
      GEMINI_TTS_MODEL: ${{ vars.GEMINI_TTS_MODEL }}
      GEMINI_TTS_STYLE: ${{ vars.GEMINI_TTS_STYLE }}
      EXPLAIN_SPEED: ${{ vars.EXPLAIN_SPEED }}
      SERIES_SHARE: ${{ vars.SERIES_SHARE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Check token and quota
        if: ${{ inputs.diagnose }}
        run: python core.py --diagnose

      - name: Install ffmpeg and Hindi fonts
        if: ${{ !inputs.diagnose }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core fonts-dejavu-core libfribidi0 libharfbuzz0b

      - name: Make and post the Reel
        if: ${{ !inputs.diagnose }}
        env:
          INPUT_TOPIC: ${{ inputs.topic }}
          INPUT_DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          ARGS=""
          if [ "$INPUT_DRY" = "true" ]; then ARGS="--dry-run"; fi
          for attempt in 1 2 3; do
            python story.py $ARGS --topic "$INPUT_TOPIC" && exit 0
            rc=$?
            if [ "$rc" -eq 3 ]; then echo "Posting failed (token/account problem): not retrying."; exit 3; fi
            echo "attempt $attempt failed"; sleep 30
          done
          exit 1

      - name: Save what was posted (so topics never repeat)
        if: ${{ success() && (github.event_name != 'workflow_dispatch' || (!inputs.dry_run && !inputs.diagnose)) }}
        run: |
          if [ -f state.json ]; then
            git config user.name "shivgatha-bot"
            git config user.email "shivgatha-bot@users.noreply.github.com"
            git add state.json
            if git diff --cached --quiet; then
              echo "no state change"
            else
              git commit -m "state: update posted topics"
              git pull --rebase origin "${{ github.ref_name }}" || true
              git push
            fi
          fi

      - name: Keep the video and caption (14 days)
        if: ${{ always() && !inputs.diagnose }}
        uses: actions/upload-artifact@v4
        with:
          name: shivgatha-output
          path: output/
          retention-days: 14
          if-no-files-found: ignore
