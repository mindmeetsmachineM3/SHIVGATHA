name: Refresh Instagram token

# The Instagram token lasts 60 days. This renews it every week and stores the new one in the IG_ACCESS_TOKEN secret.
on:
  schedule:
    - cron: "15 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests python-dotenv
      - name: Refresh and save the new token
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          NEW_TOKEN_FILE: new_token.txt
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          python core.py --refresh-token
          gh secret set IG_ACCESS_TOKEN --repo "${{ github.repository }}" < new_token.txt
          rm -f new_token.txt
